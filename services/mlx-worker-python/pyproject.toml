[project]
name = "melix-mlx-worker"
version = "0.1.0"
description = "Python worker for the Melix execution plane."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "grpcio>=1.71.0",
  "protobuf>=5.29.0",
]

[dependency-groups]
dev = [
  "coverage>=7.10.0",
  "grpcio-tools>=1.71.0",
  "pytest>=8.3.0",
]

[project.optional-dependencies]
mlx = [
  "mlx>=0.31.2,<0.32",
  "mlx-lm>=0.31.3,<0.32",
  "mlx-vlm>=0.4.4,<0.6",
]
audio-stt = [
  "mlx-audio==0.4.3",
]
audio-tts = [
  "mlx-audio==0.4.3",
]
audio = [
  "mlx-audio==0.4.3",
]
synthetic-data = [
  "data-designer>=0.5.9,<0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
