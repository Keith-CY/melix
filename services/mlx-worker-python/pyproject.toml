[project]
name = "melix-mlx-worker"
version = "0.1.0"
description = "Python worker for the Melix execution plane."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "coverage>=7.10.0",
  "grpcio>=1.71.0",
  "grpcio-tools>=1.71.0",
  "protobuf>=5.29.0",
  "pytest>=8.3.0",
]

[project.optional-dependencies]
mlx = [
  "mlx>=0.25.0",
  "mlx-lm>=0.22.0",
  "mlx-vlm @ git+https://github.com/Blaizzy/mlx-vlm.git@43b9b2078b7027e7622f34a434b2d94aada7eaad",
]
audio-stt = [
  "mlx-audio==0.2.6",
]
audio-tts = [
  "mlx-audio==0.2.6",
]
audio = [
  "mlx-audio==0.2.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
