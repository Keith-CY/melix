<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg-base); font-family: var(--font-mono); padding: 24px 20px; }
.line { margin-bottom: 8px; display: flex; gap: 12px; align-items: baseline; }
.code { font-size: 13px; color: var(--fg-primary); font-variant-numeric: tabular-nums; }
.meta { font-size: 9px; color: var(--fg-quaternary); }
</style>
</head>
<body>
<div class="line"><span class="code">mlx_lm.lora --model mlx-community/Llama-3.2-3B</span></div>
<div class="line"><span class="code" style="color:var(--accent)">✓ training complete</span><span class="meta">2.3s · 512 steps</span></div>
<div class="line"><span class="code" style="color:var(--fg-tertiary)">request req_8f2a9c · 1024 tokens</span></div>
<div class="line"><span class="code" style="color:var(--fg-secondary)">bench matrix · p50: 42ms · p95: 88ms</span></div>
<div class="line"><span class="code" style="font-size:11px; color:var(--fg-tertiary)">{"adapter": "lora-v1", "base": "Llama-3B", "steps": 512}</span></div>
</body></html>
