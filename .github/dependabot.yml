version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/services/mlx-worker-python"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      worker-python:
        patterns:
          - "*"

  - package-ecosystem: "swift"
    directories:
      - "/"
      - "/packages/protocol/swift"
      - "/services/mlx-text-worker-swift"
      - "/services/control-plane-swift"
      - "/apps/macos-menubar"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      swift-grpc:
        patterns:
          - "*github.com/grpc/*"
