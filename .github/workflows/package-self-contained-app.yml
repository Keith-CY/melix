name: package-self-contained-app

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
    paths:
      - ".github/workflows/package-self-contained-app.yml"
      - "apps/macos-menubar/**"
      - "packages/protocol/**"
      - "scripts/package_macos_menubar_app.py"
      - "services/control-plane-swift/**"
      - "services/mlx-text-worker-swift/**"
      - "services/mlx-worker-python/**"
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
    paths:
      - ".github/workflows/package-self-contained-app.yml"
      - "apps/macos-menubar/**"
      - "packages/protocol/**"
      - "scripts/package_macos_menubar_app.py"
      - "services/control-plane-swift/**"
      - "services/mlx-text-worker-swift/**"
      - "services/mlx-worker-python/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: package-self-contained-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-app:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'package-app')
    runs-on: macos-15
    outputs:
      artifact_name: ${{ steps.compute-build-metadata.outputs.artifact_name }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v7

      - name: Restore Python dependency cache
        uses: actions/cache@v5
        with:
          path: .uv-cache
          key: ${{ runner.os }}-uv-package-${{ hashFiles('uv.lock', 'pyproject.toml', 'services/mlx-worker-python/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-package-
            ${{ runner.os }}-uv-

      - name: Restore Swift build cache
        uses: actions/cache@v5
        with:
          path: |
            .swift-home
            .build/ModuleCache.noindex
            .build
            packages/protocol/swift/.build
            services/control-plane-swift/.build
            services/mlx-text-worker-swift/.build
            apps/macos-menubar/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swift-package-${{ hashFiles('Package.swift', 'Package.resolved', 'packages/protocol/swift/Package.swift', 'packages/protocol/swift/Package.resolved', 'services/control-plane-swift/Package.swift', 'services/control-plane-swift/Package.resolved', 'services/mlx-text-worker-swift/Package.swift', 'services/mlx-text-worker-swift/Package.resolved', 'apps/macos-menubar/Package.swift', 'apps/macos-menubar/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-package-
            ${{ runner.os }}-swift-

      - name: Bootstrap Python worker environment
        run: bash scripts/ci_progress.sh "Package app bootstrap" make bootstrap

      - name: Build CLI executable
        run: bash scripts/ci_progress.sh "Package app CLI build" swift build --product melix --disable-automatic-resolution

      - name: Build Swift text worker
        run: bash scripts/ci_progress.sh "Package app Swift text worker build" swift build --package-path services/mlx-text-worker-swift --disable-automatic-resolution

      - name: Build menu bar app executable
        run: bash scripts/ci_progress.sh "Package app menubar build" swift build --package-path apps/macos-menubar --disable-automatic-resolution

      - name: Packaging smoke checks
        run: bash scripts/ci_progress.sh "Package app smoke checks" make package-smoke

      - name: Prepare packaging Python runtime
        run: |
          bash scripts/ci_progress.sh "Package app Python runtime sync" \
            env UV_PROJECT_ENVIRONMENT="$GITHUB_WORKSPACE/.venv-package" \
            UV_CACHE_DIR="$GITHUB_WORKSPACE/.uv-cache" \
            uv sync --project services/mlx-worker-python --extra mlx --no-dev --frozen

      - name: Compute build metadata
        id: compute-build-metadata
        run: |
          bash scripts/ci_progress.sh "Package app build metadata" \
            env PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/services/mlx-worker-python" \
            UV_CACHE_DIR="$GITHUB_WORKSPACE/.uv-cache" \
            uv run --project services/mlx-worker-python \
            python scripts/compute_build_metadata.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --ref-type "${GITHUB_REF_TYPE:-branch}" \
            --ref-name "${GITHUB_REF_NAME:-}" \
            --sha "${GITHUB_SHA:-}" \
            --github-output "$GITHUB_OUTPUT" \
            --json

      - name: Package self-contained Melix.app
        id: package-app
        run: |
          PACKAGE_PYTHON="$GITHUB_WORKSPACE/.venv-package/bin/python"
          PYTHON_RUNTIME_ROOT="$(dirname "$(dirname "$(realpath "$PACKAGE_PYTHON")")")"
          PYTHON_SITE_PACKAGES="$("$PACKAGE_PYTHON" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          bash scripts/ci_progress.sh "Package app bundle assembly" \
            env PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/services/mlx-worker-python" \
            "$PACKAGE_PYTHON" scripts/package_macos_menubar_app.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-path "$RUNNER_TEMP/Melix.app" \
            --archive-path "$RUNNER_TEMP/${{ steps.compute-build-metadata.outputs.artifact_name }}.zip" \
            --python-runtime-root "$PYTHON_RUNTIME_ROOT" \
            --python-site-packages-path "$PYTHON_SITE_PACKAGES" \
            --version "${{ steps.compute-build-metadata.outputs.version }}" \
            --json

      - name: Upload app artifact
        id: upload-app-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.compute-build-metadata.outputs.artifact_name }}
          path: ${{ runner.temp }}/${{ steps.compute-build-metadata.outputs.artifact_name }}.zip
          if-no-files-found: error

      - name: Update PR artifact comment
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v9
        env:
          ARTIFACT_NAME: ${{ steps.compute-build-metadata.outputs.artifact_name }}
        with:
          script: |
            const marker = '<!-- melix-packaged-app-artifact -->';
            const artifactName = process.env.ARTIFACT_NAME || 'melix-app';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;
            const artifactResponse = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: context.runId,
              per_page: 100,
            });
            const artifact = artifactResponse.data.artifacts.find((entry) => entry.name === artifactName);
            const artifactUrl = artifact
              ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`
              : runUrl;
            const body = [
              marker,
              '## Download packaged Melix.app',
              '',
              `- Artifact: **${artifactName}.zip**`,
              `- Download: ${artifactUrl}`,
              `- Workflow run: ${runUrl}`,
              '',
              '> GitHub authentication may be required to download workflow artifacts.',
            ].join('\n');
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  attach-release-artifact:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-app
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged app artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package-app.outputs.artifact_name }}
          path: ${{ runner.temp }}

      - name: Attach app to GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaff05c3d0a71e06a66f # v2
        with:
          files: ${{ runner.temp }}/${{ needs.package-app.outputs.artifact_name }}.zip
          # Tag pushes are the release source of truth for this workflow, so generated notes own the body.
          generate_release_notes: true

      - name: Trigger release distribution workflows
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_ARCHIVE_NAME: ${{ needs.package-app.outputs.artifact_name }}.zip
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/$RELEASE_REPOSITORY/dispatches" \
            --field "event_type=melix-release-asset-published" \
            --field "client_payload[tag_name]=$RELEASE_TAG" \
            --field "client_payload[repository]=$RELEASE_REPOSITORY" \
            --field "client_payload[archive_name]=$RELEASE_ARCHIVE_NAME"
