syntax = "proto3";

package melix.worker.v1;

import "worker/v1/common.proto";

service RuntimeService {
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
  rpc LoadModel(LoadModelRequest) returns (LoadModelResponse);
  rpc UnloadModel(UnloadModelRequest) returns (UnloadModelResponse);
  rpc WarmupModel(WarmupModelRequest) returns (WarmupModelResponse);
  rpc GetRuntimeStats(GetRuntimeStatsRequest) returns (GetRuntimeStatsResponse);
  rpc ListLoadedModels(ListLoadedModelsRequest) returns (ListLoadedModelsResponse);
  rpc Drain(DrainRequest) returns (DrainResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

message HandshakeRequest {
  string protocol_version = 1;
  string worker_id = 2;
  string controlplane_instance_id = 3;
}

message HandshakeResponse {
  string protocol_version = 1;
  string runtime_version = 2;
  RuntimeCapabilities capabilities = 3;
}

message LoadModelRequest {
  ModelSpec model = 1;
  uint64 memory_budget_bytes = 2;
  bool pin_on_load = 3;
  bool warmup_after_load = 4;
  DiskStreamingMode disk_streaming_mode = 5;
  ModelLoadTrustPolicy load_trust = 6;
}

message LoadModelResponse {
  bool ok = 1;
  ErrorStatus error = 2;
  string model_handle = 3;
  uint64 estimated_resident_bytes = 4;
  RuntimeCapabilities resolved_capabilities = 5;
  ResidencyInfo residency = 6;
  ModelLoadTrustPolicy load_trust = 7;
}

message UnloadModelRequest {
  string model_handle = 1;
  bool force = 2;
}

message UnloadModelResponse {
  bool ok = 1;
  ErrorStatus error = 2;
}

message WarmupModelRequest {
  string model_handle = 1;
  repeated ChatMessage synthetic_messages = 2;
}

message WarmupModelResponse {
  bool ok = 1;
  ErrorStatus error = 2;
  uint64 warmup_ms = 3;
}

message RuntimeStats {
  string worker_state = 1;
  uint64 resident_bytes = 2;
  uint64 active_requests = 3;
  uint64 active_prefills = 4;
  uint64 active_decodes = 5;
  uint64 l1_cache_bytes = 6;
  uint64 l2_cache_bytes = 7;
  double l1_hit_rate = 8;
  double l2_hit_rate = 9;
  uint64 active_multimodal_requests = 10;
  string last_probe_kind = 11;
  double last_preprocess_latency_ms = 12;
  uint64 last_preprocess_input_bytes = 13;
  uint64 last_preprocess_peak_memory_bytes = 14;
  double last_first_token_latency_ms = 15;
  double last_transcription_latency_ms = 16;
  double last_speech_latency_ms = 17;
  double last_audio_duration_seconds = 18;
  uint64 last_audio_chunk_count = 19;
  uint64 last_audio_output_bytes = 20;
  double last_image_job_latency_ms = 21;
  double last_image_artifact_publish_ms = 22;
  uint64 last_image_output_bytes = 23;
  uint64 last_image_peak_memory_bytes = 24;
  uint64 model_resident_bytes = 25;
  uint64 cache_resident_bytes = 26;
  uint64 kv_cache_bytes = 27;
  uint64 peak_allocation_bytes = 28;
  uint64 memory_headroom_bytes = 29;
  double last_audio_model_load_latency_ms = 30;
  uint64 last_audio_backend_unavailable_count = 31;
  uint64 last_voice_fallback_count = 32;
  uint64 last_language_fallback_count = 33;
  uint64 last_video_effective_frame_count = 34;
  uint64 last_video_requested_frame_budget = 35;
  uint64 last_video_window_ms = 36;
  uint64 last_temp_media_artifact_count = 37;
  uint64 last_temp_media_artifact_bytes = 38;
  double last_temp_media_cleanup_latency_ms = 39;
  uint64 last_temp_media_cleanup_failure_count = 40;
  string generation_stream_owner_mode = 41;
  double worker_thread_init_latency_ms = 42;
  uint64 stream_sync_fallback_count = 43;
  bool last_speech_streaming_enabled = 44;
  uint32 last_speech_streaming_interval_ms = 45;
  double last_speech_first_audio_latency_ms = 46;
  string last_multimodal_decode_mode = 47;
  string last_multimodal_fallback_reason = 48;
  string last_multimodal_decode_sync_mode = 49;
  uint64 text_batch_generator_submitted_request_count = 50;
  uint64 text_batch_generator_completed_request_count = 51;
  uint64 text_batch_generator_step_count = 52;
  uint64 text_batch_generator_generated_token_count = 53;
  uint64 text_batch_generator_peak_active_batch_size = 54;
  double text_batch_generator_queue_wait_ms_total = 55;
  double text_batch_generator_insert_ms_total = 56;
  double text_batch_generator_executor_step_ms_total = 57;
  double text_batch_generator_next_ms_total = 58;
  double text_batch_generator_emit_ms_total = 59;
  uint64 text_batch_generator_active_batch_size = 60;
  uint64 text_batch_generator_generated_response_count = 61;
  uint64 text_batch_generator_failed_request_count = 62;
  double text_batch_generator_prepare_ms_total = 63;
  double text_batch_generator_first_response_ms_total = 64;
  double text_batch_generator_first_visible_ms_total = 65;
  uint64 text_batch_generator_first_visible_token_index_total = 66;
  uint64 text_batch_generator_first_empty_segment_count = 67;
  double last_model_load_trust_policy_resolution_ms = 68;
  uint64 model_load_trust_blocked_count = 69;
  uint64 text_batch_generator_speculative_cycle_count_total = 70;
  uint64 text_batch_generator_speculative_accepted_count_total = 71;
  uint64 text_batch_generator_speculative_rejected_count_total = 72;
  double text_batch_generator_speculative_backbone_ms_total = 73;
  double text_batch_generator_speculative_mtp_head_ms_total = 74;
  double text_batch_generator_speculative_sample_ms_total = 75;
  double text_batch_generator_speculative_cache_ops_ms_total = 76;
}

message GetRuntimeStatsRequest {}

message GetRuntimeStatsResponse {
  RuntimeStats stats = 1;
}

message ListLoadedModelsRequest {}

message ListLoadedModelsResponse {
  repeated string model_handles = 1;
  repeated LoadedModelSummary loaded_models = 2;
}

message LoadedModelSummary {
  string model_handle = 1;
  ModelSpec model = 2;
  ResidencyInfo residency = 3;
  uint64 estimated_resident_bytes = 4;
  double prompt_tps = 5;
  double generation_tps = 6;
}

message DrainRequest {
  bool stop_accepting_new = 1;
}

message DrainResponse {
  bool ok = 1;
}

message ShutdownRequest {
  bool flush_l2 = 1;
}

message ShutdownResponse {
  bool ok = 1;
}
