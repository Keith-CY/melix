syntax = "proto3";

package melix.worker.v1;

message ErrorStatus {
  string code = 1;
  string message = 2;
  bool retriable = 3;
  map<string, string> details = 4;
}

message ModelSpec {
  string model_id = 1;
  string model_path = 2;
  string model_kind = 3;
  string revision = 4;
  string tokenizer_hash = 5;
  string quant_profile_id = 6;
  string parser_mode = 7;
  string reasoning_mode = 8;
  uint32 max_context = 9;
  map<string, string> ext = 10;
  ModelCapabilityClass capability_class = 11;
  WorkerRouteClass route_class = 12;
  ModelSettings settings = 13;
  repeated string features = 14;
  RuntimeMode runtime_mode = 15;
}

enum RuntimeMode {
  RUNTIME_MODE_UNSPECIFIED = 0;
  RUNTIME_MODE_FUSED_DERIVED_MODEL = 1;
  RUNTIME_MODE_ADAPTER_BACKED = 2;
}

enum ModelCapabilityClass {
  MODEL_CAPABILITY_CLASS_UNSPECIFIED = 0;
  MODEL_CAPABILITY_TEXT = 1;
  MODEL_CAPABILITY_EMBEDDING = 2;
  MODEL_CAPABILITY_RERANK = 3;
  MODEL_CAPABILITY_MODEL_OPERATIONS = 4;
  MODEL_CAPABILITY_MULTIMODAL = 5;
  MODEL_CAPABILITY_OCR = 6;
  MODEL_CAPABILITY_VLM = 7;
  MODEL_CAPABILITY_TRANSCRIPTION = 8;
  MODEL_CAPABILITY_SPEECH = 9;
  MODEL_CAPABILITY_IMAGE_GENERATION = 10;
}

enum WorkerRouteClass {
  WORKER_ROUTE_CLASS_UNSPECIFIED = 0;
  WORKER_ROUTE_SWIFT_TEXT = 1;
  WORKER_ROUTE_PYTHON_TEXT_COMPATIBILITY = 2;
  WORKER_ROUTE_PYTHON_EMBEDDING = 3;
  WORKER_ROUTE_PYTHON_RERANK = 4;
  WORKER_ROUTE_PYTHON_MODEL_OPERATIONS = 5;
  WORKER_ROUTE_PYTHON_OCR = 6;
  WORKER_ROUTE_PYTHON_VLM = 7;
  WORKER_ROUTE_PYTHON_TRANSCRIPTION = 8;
  WORKER_ROUTE_PYTHON_SPEECH = 9;
  WORKER_ROUTE_PYTHON_IMAGE = 10;
}

enum MemoryResidencyPolicy {
  MEMORY_RESIDENCY_POLICY_UNSPECIFIED = 0;
  MEMORY_RESIDENCY_EVICTABLE = 1;
  MEMORY_RESIDENCY_PINNED = 2;
  MEMORY_RESIDENCY_TTL = 3;
}

enum DiskStreamingMode {
  DISK_STREAMING_MODE_UNSPECIFIED = 0;
  DISK_STREAMING_DISABLED = 1;
  DISK_STREAMING_PREFER_DISK = 2;
  DISK_STREAMING_REQUIRE_DISK = 3;
}

enum ResidencyState {
  RESIDENCY_STATE_UNSPECIFIED = 0;
  RESIDENCY_STATE_DISCOVERED = 1;
  RESIDENCY_STATE_LOADING = 2;
  RESIDENCY_STATE_WARM = 3;
  RESIDENCY_STATE_PINNED = 4;
  RESIDENCY_STATE_EVICTING = 5;
  RESIDENCY_STATE_UNLOADED = 6;
  RESIDENCY_STATE_FAILED = 7;
}

message ResidencyInfo {
  ResidencyState state = 1;
  MemoryResidencyPolicy policy = 2;
  bool pin_requested = 3;
  bool pinned = 4;
  uint32 ttl_seconds = 5;
  string transition_reason = 6;
  DiskStreamingMode effective_disk_streaming_mode = 7;
}

message RuntimeCapabilities {
  CacheCapabilities cache = 1;
  ExecutionCapabilities execution = 2;
  ParserCapabilities parsing = 3;
  MultimodalCapabilities multimodal = 4;
  repeated Capability ext = 5;
}

message CacheCapabilities {
  bool supports_prefix_cache = 1;
  bool supports_paged_cache = 2;
  bool supports_disk_cache = 3;
  repeated string kv_quant_profiles = 4;
  bool supports_boundary_snapshots = 5;
  repeated CacheMode supported_modes = 6;
  repeated CacheMode experimental_modes = 7;
}

message ExecutionCapabilities {
  bool supports_continuous_batching = 1;
  bool supports_speculative_decoding = 2;
  bool supports_disk_streaming = 3;
}

message ParserCapabilities {
  bool supports_tool_call_auto_parsing = 1;
  bool supports_reasoning_separation = 2;
  repeated string supported_tool_parsers = 3;
  repeated string supported_reasoning_parsers = 4;
}

enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_TEXT = 1;
  MEDIA_TYPE_IMAGE = 2;
  MEDIA_TYPE_AUDIO = 3;
  MEDIA_TYPE_VIDEO = 4;
}

enum MediaSourceKind {
  MEDIA_SOURCE_KIND_UNSPECIFIED = 0;
  MEDIA_SOURCE_URI = 1;
  MEDIA_SOURCE_INLINE_BYTES = 2;
}

message MediaMetadata {
  MediaType media_type = 1;
  MediaSourceKind source_kind = 2;
  string mime_type = 3;
  string format = 4;
  string filename = 5;
  uint64 byte_length = 6;
  uint32 duration_ms = 7;
  uint32 width = 8;
  uint32 height = 9;
  map<string, string> preprocessing_hints = 10;
  uint32 frame_budget = 11;
  uint32 start_ms = 12;
  uint32 end_ms = 13;
}

message MultimodalCapabilities {
  bool supports_vision = 1;
  bool supports_audio = 2;
  bool supports_image_generation = 3;
  bool supports_ocr = 4;
  bool supports_vlm = 5;
  bool supports_transcription = 6;
  bool supports_speech = 7;
}

enum ImageJobState {
  IMAGE_JOB_STATE_UNSPECIFIED = 0;
  IMAGE_JOB_QUEUED = 1;
  IMAGE_JOB_RUNNING = 2;
  IMAGE_JOB_CANCELED = 3;
  IMAGE_JOB_FAILED = 4;
  IMAGE_JOB_COMPLETED = 5;
}

enum ImageArtifactRole {
  IMAGE_ARTIFACT_ROLE_UNSPECIFIED = 0;
  IMAGE_ARTIFACT_INPUT = 1;
  IMAGE_ARTIFACT_MASK = 2;
  IMAGE_ARTIFACT_GENERATED = 3;
  IMAGE_ARTIFACT_EDIT_SOURCE = 4;
  IMAGE_ARTIFACT_PREVIEW = 5;
}

message ImageJobProgress {
  string stage = 1;
  float pct = 2;
  uint32 completed_steps = 3;
  uint32 total_steps = 4;
}

message ImageArtifactMetadata {
  string artifact_id = 1;
  string job_id = 2;
  ImageArtifactRole role = 3;
  string mime_type = 4;
  string format = 5;
  uint32 width = 6;
  uint32 height = 7;
  uint64 byte_length = 8;
  string storage_uri = 9;
  string sha256 = 10;
  uint32 variant_index = 11;
  map<string, string> ext = 12;
  string parent_artifact_id = 13;
}

message Capability {
  string name = 1;
  map<string, string> metadata = 2;
}

enum CacheMode {
  CACHE_MODE_UNSPECIFIED = 0;
  CACHE_MODE_TIERED = 1;
  CACHE_MODE_ROTATING = 2;
  CACHE_MODE_HYBRID = 3;
}

message CacheScope {
  string model_id = 1;
  string revision = 2;
  string tokenizer_hash = 3;
  string quant_profile_id = 4;
  string prompt_template_hash = 5;
  string parser_mode = 6;
  string reasoning_mode = 7;
  string multimodal_adapter_hash = 8;
  string scope_id = 9;
  string reasoning_effort = 10;
  string tool_parser_mode = 11;
  string structured_output_mode = 12;
  string chat_template_kwargs_hash = 13;
  bool reasoning_continuity_present = 14;
}

message CacheKey {
  bytes prefix_hash = 1;
  bytes fingerprint_hash = 2;
  string scope_id = 3;
}

message PrefixRef {
  string prefix_id = 1;
  CacheKey cache_key = 2;
  CacheScope scope = 3;
  uint32 token_length = 4;
  bool pinned = 5;
  string tier = 6;
}

message SnapshotRef {
  string snapshot_id = 1;
  string request_id = 2;
  string session_id = 3;
  string branch_id = 4;
  uint32 token_boundary = 5;
  string checkpoint_id = 6;
}

message SamplingConfig {
  float temperature = 1;
  float top_p = 2;
  uint32 top_k = 3;
  float frequency_penalty = 4;
  float presence_penalty = 5;
  uint32 max_output_tokens = 6;
  repeated string stop = 7;
  uint32 seed = 8;
}

message ReasoningConfig {
  bool enabled = 1;
  string parser = 2;
  bool separate_stream = 3;
  string mode = 4;
  string mode_source = 5;
  string effort = 6;
  string auto_detect_model_family = 7;
  bool continuity_rehydrated = 8;
}

message ToolDefinition {
  string name = 1;
  string description = 2;
  string json_schema = 3;
}

message ToolConfig {
  repeated ToolDefinition tools = 1;
  string schema_format = 2;
  string schema_version = 3;
  string toolset_version = 4;
  string parser = 5;
  string parser_contract_version = 6;
  string tool_choice = 7;
}

message MessagePart {
  oneof part {
    string text = 1;
    string image_uri = 2;
    bytes image_bytes = 3;
    string audio_uri = 4;
    bytes audio_bytes = 5;
    string video_uri = 7;
    bytes video_bytes = 8;
  }
  MediaMetadata media = 6;
}

message ChatMessage {
  string role = 1;
  string name = 2;
  repeated MessagePart parts = 3;
}

message CacheHints {
  bool allow_l1 = 1;
  bool allow_l2 = 2;
  bool persist_l2 = 3;
  bool prefer_hot_prefix = 4;
  bool save_boundary_snapshot = 5;
  string restore_snapshot_id = 6;
  repeated string pin_prefix_ids = 7;
  string cache_policy = 8;
  uint32 preferred_block_size = 9;
  CacheRestorePlan restore_plan = 10;
  CacheMode cache_mode = 11;
}

message RequestIdentity {
  string request_id = 1;
  string session_id = 2;
  string branch_id = 3;
  string parent_request_id = 4;
  string workflow_run_id = 5;
  string workflow_node_id = 6;
  string latency_class = 7;
}

message SchedulingHints {
  int32 priority = 1;
  string lane = 2;
  bool latency_sensitive = 3;
  uint32 queue_delay_ms = 4;
  uint32 queue_position = 5;
  string admission_policy = 6;
}

enum AdmissionState {
  ADMISSION_STATE_UNSPECIFIED = 0;
  ADMISSION_QUEUED = 1;
  ADMISSION_ADMITTED = 2;
  ADMISSION_REJECTED = 3;
  ADMISSION_DROPPED = 4;
}

enum ExecutionPhase {
  EXECUTION_PHASE_UNSPECIFIED = 0;
  EXECUTION_QUEUED = 1;
  EXECUTION_ADMITTED = 2;
  EXECUTION_PREFILLING = 3;
  EXECUTION_DECODING = 4;
  EXECUTION_COMPLETED = 5;
  EXECUTION_ABORTED = 6;
  EXECUTION_FAILED = 7;
}

enum AccelerationMode {
  ACCELERATION_MODE_UNSPECIFIED = 0;
  ACCELERATION_MODE_BASELINE = 1;
  ACCELERATION_MODE_SPECULATIVE_DECODE = 2;
  ACCELERATION_MODE_ACCELERATED_PREFILL = 3;
  ACCELERATION_MODE_ACTIVE_KV_QUANTIZED = 4;
  ACCELERATION_MODE_SPARSE_PREFILL = 5;
}

message AccelerationPolicy {
  AccelerationMode mode = 1;
  string profile_id = 2;
  string draft_model_id = 3;
  string prefill_hint = 4;
  string active_kv_quant_profile = 5;
  bool allow_baseline_fallback = 6;
  map<string, string> ext = 7;
  uint32 num_draft_tokens = 8;
}

message ModelSettings {
  string alias = 1;
  string type_override = 2;
  uint32 ttl_seconds = 3;
  bool pin_on_load = 4;
  MemoryResidencyPolicy memory_policy = 5;
  AccelerationPolicy default_acceleration = 6;
  map<string, string> ext = 7;
  DiskStreamingMode disk_streaming_mode = 8;
  CacheMode cache_mode = 9;
  uint64 cache_memory_budget_bytes = 10;
  uint32 cache_memory_budget_pct = 11;
  uint32 cache_block_size_tokens = 12;
  string cache_directory = 13;
  uint64 multimodal_cache_budget_bytes = 14;
}

message BlockTable {
  repeated BlockRef blocks = 1;
  CacheKey cache_key = 2;
  string scope_id = 3;
  repeated PageRef pages = 4;
  uint32 total_token_count = 5;
}

message BlockRef {
  string block_id = 1;
  int32 token_start = 2;
  int32 token_end = 3;
  uint64 bytes = 4;
}

message PageRef {
  string page_id = 1;
  repeated string block_ids = 2;
  uint32 token_start = 3;
  uint32 token_end = 4;
  uint64 bytes = 5;
}

message RestoreBoundaryRef {
  SnapshotRef snapshot = 1;
  CacheKey cache_key = 2;
  string scope_id = 3;
  string boundary_kind = 4;
}

message CacheRestorePlan {
  string plan_id = 1;
  RestoreBoundaryRef boundary = 2;
  string block_table_id = 3;
  BlockTable block_table = 4;
  repeated PageRef pages = 5;
  uint32 restored_token_count = 6;
  bool partial = 7;
  string tier = 8;
  CacheMode cache_mode = 9;
}
