syntax = "proto3";

package melix.worker.v1;

import "worker/v1/common.proto";

service InferenceService {
  rpc Generate(GenerateRequest) returns (stream ExecuteEvent);
  rpc Prefill(PrefillRequest) returns (PrefillResponse);
  rpc Decode(DecodeRequest) returns (stream ExecuteEvent);
  rpc Abort(AbortRequest) returns (AbortResponse);

  rpc Embed(EmbedRequest) returns (EmbedResponse);
  rpc Rerank(RerankRequest) returns (RerankResponse);
  rpc Transcribe(TranscribeRequest) returns (TranscribeResponse);
  rpc Speak(SpeakRequest) returns (SpeakResponse);
  rpc SpeakStream(SpeakRequest) returns (stream SpeakStreamEvent);
  rpc ImageGenerate(ImageGenerateRequest) returns (ImageGenerateResponse);
  rpc ImageEdit(ImageEditRequest) returns (ImageEditResponse);
}

message ExecutionMetadata {
  RequestIdentity id = 1;
  string model_handle = 2;
  CacheScope scope = 3;
  CacheKey cache_key = 4;
  SchedulingHints scheduling = 5;
  ToolConfig tool_config = 6;
  ReasoningConfig reasoning = 7;
  CacheHints cache_hints = 8;
  map<string, string> ext = 9;
  AccelerationPolicy acceleration = 10;
}

message ExecutionMode {
  oneof mode {
    GenerateMode generate = 1;
    PrefillMode prefill = 2;
    DecodeMode decode = 3;
  }
}

message GenerateMode {}

message PrefillMode {
  uint32 prefill_step_size = 1;
}

message DecodeMode {
  uint32 max_output_tokens = 1;
}

message GenerateRequest {
  ExecutionMetadata execution = 1;
  repeated ChatMessage messages = 2;
  SamplingConfig sampling = 3;
  bool stream = 4;
  bool return_usage = 5;
}

message PrefillRequest {
  ExecutionMetadata execution = 1;
  repeated ChatMessage messages = 2;
  uint32 prefill_step_size = 3;
  bool return_decode_handle = 4;
  string resume_hint = 5;
  CacheRestorePlan restore_plan = 6;
}

message PrefillResponse {
  bool ok = 1;
  ErrorStatus error = 2;
  string decode_handle = 3;
  string block_table_id = 4;
  BlockTable block_table = 5;
  string restored_snapshot_id = 6;
  uint32 prompt_tokens = 7;
  ExecutionPhase lifecycle_phase = 8;
  AdmissionState admission_state = 9;
  AccelerationPolicy applied_acceleration = 10;
  CacheRestorePlan restore_plan = 11;
  uint32 recovered_prefix_tokens = 12;
  string cache_hit_mode = 13;
  string fallback_reason = 14;
}

message DecodeRequest {
  ExecutionMetadata execution = 1;
  string decode_handle = 2;
  SamplingConfig sampling = 3;
  uint32 max_output_tokens = 4;
  bool return_usage = 5;
  uint32 decode_step_size = 6;
  string prefill_token = 7;
}

message AbortRequest {
  string request_id = 1;
}

message AbortResponse {
  bool ok = 1;
  bool found = 2;
}

message ExecuteEvent {
  string request_id = 1;
  string execution_kind = 2;
  uint64 seq = 3;
  ExecutionPhase phase = 4;
  AdmissionState admission_state = 5;
  string lane = 6;
  uint32 queue_position = 7;
  double queue_delay_ms = 8;
  AccelerationMode acceleration_mode = 9;

  oneof payload {
    PrefillStarted prefill_started = 10;
    PrefillProgress prefill_progress = 11;
    TokenDelta token_delta = 12;
    ReasoningDelta reasoning_delta = 13;
    ToolCallDelta tool_call_delta = 14;
    UsageDelta usage_delta = 15;
    CacheDecision cache_decision = 16;
    BoundarySnapshotCreated snapshot_created = 17;
    Completed completed = 18;
    ErrorEvent error = 19;
    Heartbeat heartbeat = 20;
    Queued queued = 21;
    Admitted admitted = 22;
    DecodeStarted decode_started = 23;
    AccelerationApplied acceleration_applied = 24;
    AnnotationDelta annotation_delta = 25;
    ToolResultDelta tool_result_delta = 26;
  }
}

message Queued {
  string lane = 1;
  uint32 queue_position = 2;
  double priority_score = 3;
  double backpressure = 4;
}

message Admitted {
  string lane = 1;
  string worker_id = 2;
  double queue_delay_ms = 3;
}

message PrefillStarted {
  uint32 input_tokens = 1;
  bool cache_hit_l1 = 2;
  bool cache_hit_l2 = 3;
}

message PrefillProgress {
  uint32 processed_tokens = 1;
  uint32 total_tokens = 2;
}

message DecodeStarted {
  string decode_handle = 1;
  uint32 max_output_tokens = 2;
  bool resumed_from_prefill = 3;
}

message TokenDelta {
  string text = 1;
  string raw_text = 2;
  string parser_observation = 3;
}

message ReasoningDelta {
  string text = 1;
  string raw_text = 2;
  string mode_source = 3;
}

message ToolCallDelta {
  string call_id = 1;
  string tool_name = 2;
  string arguments_json_fragment = 3;
  uint32 fragment_index = 4;
  string parser_mode = 5;
  bool complete = 6;
}

message AnnotationDelta {
  string annotation_id = 1;
  string kind = 2;
  uint32 start_offset = 3;
  uint32 end_offset = 4;
  string payload_json = 5;
}

message ToolResultDelta {
  string call_id = 1;
  string status = 2;
  string result_json = 3;
}

message UsageDelta {
  uint32 prompt_tokens = 1;
  uint32 completion_tokens = 2;
}

message CacheDecision {
  string block_table_id = 1;
  string restored_snapshot_id = 2;
  bool persisted_to_l2 = 3;
}

message AccelerationApplied {
  AccelerationPolicy policy = 1;
}

message BoundarySnapshotCreated {
  string snapshot_id = 1;
  uint32 token_boundary = 2;
}

message Completed {
  string finish_reason = 1;
  string assistant_text = 2;
  string reasoning_text = 3;
  string raw_assistant_text = 4;
  string reasoning_mode_source = 5;
  string reasoning_effort = 6;
  bool reasoning_continuity_preserved = 7;
  map<string, string> parser_metrics = 8;
}

message ErrorEvent {
  ErrorStatus error = 1;
}

message Heartbeat {
  int64 unix_ms = 1;
}

message EmbedRequest {
  RequestIdentity id = 1;
  string model_handle = 2;
  repeated string inputs = 3;
}

message Embedding {
  repeated float values = 1;
}

message EmbedResponse {
  repeated Embedding embeddings = 1;
  ErrorStatus error = 2;
}

message RerankRequest {
  RequestIdentity id = 1;
  string model_handle = 2;
  string query = 3;
  repeated string documents = 4;
  uint32 top_k = 5;
}

message RerankItem {
  uint32 index = 1;
  float score = 2;
}

message RerankResponse {
  repeated RerankItem items = 1;
  ErrorStatus error = 2;
}

message TranscribeRequest {
  RequestIdentity id = 1;
  string model_handle = 2;
  bytes audio_bytes = 3;
  string format = 4;
  string task = 5;
  string audio_uri = 6;
  MediaMetadata audio = 7;
  string language = 8;
}

message TranscribeResponse {
  string text = 1;
  ErrorStatus error = 2;
  string language = 3;
  double duration_seconds = 4;
}

message SpeakRequest {
  RequestIdentity id = 1;
  string model_handle = 2;
  string input = 3;
  string voice = 4;
  string format = 5;
  string instructions = 6;
  SamplingConfig sampling = 7;
  map<string, string> ext = 8;
  bool streaming_enabled = 9;
  uint32 stream_interval_ms = 10;
}

message SpeakResponse {
  bytes audio_bytes = 1;
  string format = 2;
  ErrorStatus error = 3;
}

enum SpeakStreamEventKind {
  SPEAK_STREAM_EVENT_KIND_UNSPECIFIED = 0;
  SPEAK_STREAM_EVENT_KIND_ENVELOPE = 1;
  SPEAK_STREAM_EVENT_KIND_AUDIO_CHUNK = 2;
  SPEAK_STREAM_EVENT_KIND_FINISH = 3;
  SPEAK_STREAM_EVENT_KIND_ERROR = 4;
}

message SpeakStreamEnvelope {
  string format = 1;
  string container = 2;
  string codec = 3;
  uint32 sample_rate_hz = 4;
  uint32 channel_count = 5;
  uint32 bits_per_sample = 6;
  uint32 stream_interval_ms = 7;
  bool wav_sizes_unknown = 8;
  map<string, string> ext = 9;
}

message SpeakStreamFinish {
  bool speech_streaming_enabled = 1;
  uint32 speech_streaming_interval_ms = 2;
  double speech_first_audio_latency_ms = 3;
  double speech_latency_ms = 4;
  uint64 audio_bytes = 5;
  uint64 audio_chunk_count = 6;
}

message SpeakStreamEvent {
  SpeakStreamEventKind kind = 1;
  bytes audio_bytes = 2;
  SpeakStreamEnvelope envelope = 3;
  SpeakStreamFinish finish = 4;
  ErrorStatus error = 5;
}

enum ImageEditMode {
  IMAGE_EDIT_MODE_UNSPECIFIED = 0;
  IMAGE_EDIT_MODE_EDIT = 1;
  IMAGE_EDIT_MODE_VARIATION = 2;
  IMAGE_EDIT_MODE_ITERATE = 3;
}

message ImageGenerateRequest {
  RequestIdentity id = 1;
  string model_handle = 2;
  string prompt = 3;
  string size = 4;
  uint32 n = 5;
  map<string, string> ext = 6;
  string response_format = 7;
  string artifact_namespace = 8;
}

message ImageGenerateResponse {
  repeated bytes images = 1;
  ErrorStatus error = 2;
  ImageJobDescriptor job = 3;
}

message ImageEditRequest {
  RequestIdentity id = 1;
  string model_handle = 2;
  string prompt = 3;
  bytes image = 4;
  float strength = 5;
  string size = 6;
  bytes mask = 7;
  uint32 n = 8;
  string response_format = 9;
  string image_uri = 10;
  string mask_uri = 11;
  map<string, string> ext = 12;
  string source_artifact_id = 13;
  string prompt_delta = 14;
  ImageEditMode edit_mode = 15;
}

message ImageEditResponse {
  repeated bytes images = 1;
  ErrorStatus error = 2;
  ImageJobDescriptor job = 3;
}

message ImageJobDescriptor {
  string request_id = 1;
  string job_id = 2;
  string model_handle = 3;
  string operation = 4;
  ImageJobState state = 5;
  ImageJobProgress progress = 6;
  repeated ImageArtifactMetadata artifacts = 7;
  ErrorStatus error = 8;
  bool cancelable = 9;
  int64 created_at_unix_ms = 10;
  int64 updated_at_unix_ms = 11;
  string source_artifact_id = 12;
  string source_job_id = 13;
  string prompt_delta = 14;
  ImageEditMode edit_mode = 15;
}
