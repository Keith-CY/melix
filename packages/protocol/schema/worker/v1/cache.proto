syntax = "proto3";

package melix.worker.v1;

import "worker/v1/common.proto";

service CacheService {
  rpc GetCacheStats(GetCacheStatsRequest) returns (GetCacheStatsResponse);
  rpc PinPrefix(PinPrefixRequest) returns (PinPrefixResponse);
  rpc UnpinPrefix(UnpinPrefixRequest) returns (UnpinPrefixResponse);
  rpc SaveBoundarySnapshot(SaveBoundarySnapshotRequest) returns (SaveBoundarySnapshotResponse);
  rpc RestoreBoundarySnapshot(RestoreBoundarySnapshotRequest) returns (RestoreBoundarySnapshotResponse);
  rpc PurgeCache(PurgeCacheRequest) returns (PurgeCacheResponse);
}

message CacheStats {
  uint64 l1_bytes = 1;
  uint64 l2_bytes = 2;
  uint64 block_count = 3;
  uint64 pinned_prefix_count = 4;
  uint64 snapshot_count = 5;
  double l1_hit_rate = 6;
  double l2_hit_rate = 7;
  double dedup_ratio = 8;
  uint64 quantized_bytes = 9;
  double compression_ratio = 10;
  double l2_restore_hit_rate = 11;
  CacheMode active_mode = 12;
  string cache_root = 13;
  uint32 initial_cache_blocks = 14;
  repeated CacheMode supported_modes = 15;
  repeated CacheMode experimental_modes = 16;
  bool supports_prefix_cache = 17;
  bool supports_paged_cache = 18;
  bool supports_disk_cache = 19;
  bool supports_boundary_snapshots = 20;
  string runtime_cache_fingerprint = 21;
  uint64 cache_namespace_mismatch_count = 22;
  uint64 active_memory_bytes = 23;
  uint64 max_working_set_bytes = 24;
  uint64 effective_cache_budget_bytes = 25;
}

message CacheScopeSummary {
  string scope_id = 1;
  CacheScope scope = 2;
  uint64 l1_bytes = 3;
  uint64 l2_bytes = 4;
  uint64 block_count = 5;
  uint64 prefix_count = 6;
  uint64 snapshot_count = 7;
  repeated BlockRef hot_blocks = 8;
}

message CacheSnapshot {
  CacheStats stats = 1;
  repeated PrefixRef pinned_prefixes = 2;
  repeated PrefixRef hot_prefixes = 3;
  repeated SnapshotRef snapshots = 4;
  repeated CacheScopeSummary scopes = 5;
}

message GetCacheStatsRequest {}

message GetCacheStatsResponse {
  CacheStats stats = 1;
  CacheSnapshot snapshot = 2;
}

message PinPrefixRequest {
  PrefixRef prefix = 1;
}

message PinPrefixResponse {
  bool ok = 1;
  ErrorStatus error = 2;
}

message UnpinPrefixRequest {
  PrefixRef prefix = 1;
}

message UnpinPrefixResponse {
  bool ok = 1;
  ErrorStatus error = 2;
}

message SaveBoundarySnapshotRequest {
  string request_id = 1;
  string decode_handle = 2;
  uint32 token_boundary = 3;
}

message SaveBoundarySnapshotResponse {
  bool ok = 1;
  ErrorStatus error = 2;
  string snapshot_id = 3;
  SnapshotRef snapshot = 4;
  RestoreBoundaryRef restore_boundary = 5;
}

message RestoreBoundarySnapshotRequest {
  string snapshot_id = 1;
  RestoreBoundaryRef restore_boundary = 2;
}

message RestoreBoundarySnapshotResponse {
  bool ok = 1;
  ErrorStatus error = 2;
  string decode_handle = 3;
  string block_table_id = 4;
  BlockTable block_table = 5;
  SnapshotRef snapshot = 6;
  RestoreBoundaryRef restore_boundary = 7;
  CacheRestorePlan restore_plan = 8;
}

message PurgeCacheRequest {
  CacheScope scope = 1;
  CacheKey cache_key = 2;
  string tier = 3;
  bool include_pinned = 4;
}

message PurgeCacheResponse {
  bool ok = 1;
  ErrorStatus error = 2;
  uint64 purged_blocks = 3;
}
