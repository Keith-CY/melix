syntax = "proto3";

package melix.worker.v1;

import "worker/v1/common.proto";

service MaintenanceService {
  rpc ConvertModel(ConvertModelRequest) returns (stream ConvertModelEvent);
  rpc GetModelInfo(GetModelInfoRequest) returns (GetModelInfoResponse);
  rpc RunDoctor(RunDoctorRequest) returns (RunDoctorResponse);
  rpc RunBench(RunBenchRequest) returns (stream RunBenchEvent);
  rpc RunBenchMatrix(RunBenchMatrixRequest) returns (RunBenchMatrixResponse);
  rpc RunEvaluation(RunEvaluationRequest) returns (RunEvaluationResponse);
  rpc ExportResults(ExportResultsRequest) returns (ExportResultsResponse);
  rpc SubmitResults(SubmitResultsRequest) returns (SubmitResultsResponse);
  rpc SearchHubModels(SearchHubModelsRequest) returns (SearchHubModelsResponse);
  rpc GetHubModelCard(GetHubModelCardRequest) returns (GetHubModelCardResponse);
}

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_HEALTHY = 1;
  HEALTH_STATUS_WARNING = 2;
  HEALTH_STATUS_DEGRADED = 3;
  HEALTH_STATUS_FAILED = 4;
}

message DoctorFinding {
  string code = 1;
  HealthStatus severity = 2;
  string summary = 3;
  string detail = 4;
}

message ConvertModelRequest {
  string source_model = 1;
  string output_dir = 2;
  string weight_quant = 3;
  string kv_quant = 4;
  bool generate_manifest = 5;
  bool run_smoke_test = 6;
  map<string, string> ext = 7;
  QuantizationProfile quant_profile = 8;
}

message ConvertModelEvent {
  oneof payload {
    ConvertStarted started = 1;
    ConvertProgress progress = 2;
    ConvertManifest manifest = 3;
    ConvertCompleted completed = 4;
    ConvertFailed failed = 5;
  }
}

message ConvertStarted {
  string job_id = 1;
}

message ConvertProgress {
  string stage = 1;
  float pct = 2;
}

message ConvertManifest {
  string manifest_json = 1;
  QuantizationProfile quant_profile = 2;
  QuantizedArtifact artifact = 3;
}

message ConvertCompleted {
  string output_path = 1;
  QuantizationProfile quant_profile = 2;
  QuantizedArtifact artifact = 3;
}

message ConvertFailed {
  ErrorStatus error = 1;
}

message QuantizationProfile {
  string algorithm = 1;
  string schema_version = 2;
  string quant_profile_id = 3;
  string weight_quant = 4;
  string kv_quant = 5;
  map<string, string> ext = 6;
}

message QuantizedArtifact {
  string schema_version = 1;
  string artifact_kind = 2;
  string manifest_path = 3;
  string bundle_path = 4;
  uint64 artifact_bytes = 5;
  uint64 manifest_bytes = 6;
  bool serving_compatible = 7;
  bool smoke_test_requested = 8;
  bool smoke_test_passed = 9;
  string runtime = 10;
}

message GetModelInfoRequest {
  string source_model = 1;
}

message GetModelInfoResponse {
  bool ok = 1;
  ErrorStatus error = 2;
  string model_kind = 3;
  uint32 max_context = 4;
  repeated string supported_parsers = 5;
  repeated string supported_modalities = 6;
  repeated string supported_tasks = 7;
  string backend_id = 8;
  string family_id = 9;
  string model_path = 10;
  string model_revision = 11;
  string default_workflow_role = 12;
  string detected_identity_source = 13;
}

message RunDoctorRequest {
  string model_handle = 1;
  bool include_cache_diagnostics = 2;
  bool include_memory_report = 3;
}

message RunDoctorResponse {
  bool ok = 1;
  ErrorStatus error = 2;
  string report_markdown = 3;
  HealthStatus health_status = 4;
  repeated DoctorFinding findings = 5;
}

message RunBenchRequest {
  string model_handle = 1;
  repeated string suites = 2;
  map<string, string> parameters = 3;
  string task_kind = 4;
  string source_repo = 5;
  repeated uint32 context_lengths = 6;
  uint32 generation_length = 7;
  repeated uint32 batch_sizes = 8;
  uint32 repeats = 9;
  string cache_profile = 10;
  string reasoning_mode = 11;
  string structured_output_mode = 12;
}

message RunBenchEvent {
  oneof payload {
    BenchStarted started = 1;
    BenchProgress progress = 2;
    BenchMetric metric = 3;
    BenchCompleted completed = 4;
    BenchFailed failed = 5;
  }
}

message BenchStarted {
  string job_id = 1;
}

message BenchProgress {
  string suite = 1;
  float pct = 2;
}

message BenchMetric {
  string name = 1;
  double value = 2;
  string unit = 3;
}

message BenchCompleted {
  string report_path = 1;
  string evidence_path = 2;
}

message BenchFailed {
  ErrorStatus error = 1;
}

message RunBenchMatrixRequest {
  string model_handle = 1;
  string task_kind = 2;
  string source_repo = 3;
  repeated string suite_ids = 4;
  repeated uint32 context_lengths = 5;
  repeated uint32 generation_lengths = 6;
  repeated uint32 batch_sizes = 7;
  repeated string cache_profiles = 8;
  repeated string reasoning_modes = 9;
  repeated string structured_output_modes = 10;
  repeated uint32 concurrency_levels = 11;
  uint32 repeats = 12;
  uint32 requests = 13;
  uint32 duration_seconds = 14;
  bool allow_large_matrix = 15;
}

message BenchmarkMatrixJobSummary {
  string schema_version = 1;
  string job_id = 2;
  string model_id = 3;
  string task_kind = 4;
  string source_repo = 5;
  repeated string suite_ids = 6;
  string benchmark_mode = 7;
  string status = 8;
  string output_dir = 9;
  int64 created_at_unix_ms = 10;
  int64 updated_at_unix_ms = 11;
}

message BenchmarkMatrixSummaryRow {
  string job_id = 1;
  string task_kind = 2;
  string source_repo = 3;
  string model_id = 4;
  string suite_id = 5;
  uint32 context_length = 6;
  uint32 generation_length = 7;
  uint32 batch_size = 8;
  string cache_profile = 9;
  string reasoning_mode = 10;
  string structured_output_mode = 11;
  uint32 concurrency_level = 12;
  uint32 repeats = 13;
  uint32 requests = 14;
  uint32 duration_seconds = 15;
  double ttft_mean_ms = 16;
  double ttft_std_ms = 17;
  double request_latency_mean_ms = 18;
  double request_latency_std_ms = 19;
  double prefill_tokens_per_second_mean = 20;
  double decode_tokens_per_second_mean = 21;
  double throughput_requests_per_second = 22;
  double throughput_tokens_per_second = 23;
  double success_rate = 24;
  uint64 peak_memory_bytes_max = 25;
  double queue_wait_mean_ms = 26;
  double queue_wait_p95_ms = 27;
  int64 created_at_unix_ms = 28;
  uint32 tool_call_count = 29;
  double tool_latency_ms = 30;
  uint64 observation_bytes = 31;
  double fatal_rate = 32;
  uint32 turn_count = 33;
}

message RunBenchMatrixResponse {
  BenchmarkMatrixJobSummary job = 1;
  repeated BenchmarkMatrixSummaryRow summary_rows = 2;
}

message EvaluationSourceLocalFile {
  string path = 1;
}

message EvaluationSourceHFDataset {
  string dataset_path = 1;
  string dataset_name = 2;
  string dataset_revision = 3;
  string split = 4;
}

message EvaluationSource {
  oneof kind {
    EvaluationSourceLocalFile local_csv = 1;
    EvaluationSourceLocalFile local_jsonl = 2;
    EvaluationSourceHFDataset hf_dataset = 3;
  }
}

message EvaluationFieldMapping {
  string system_path = 1;
  string input_text_path = 2;
  string target_path = 3;
  string sample_id_path = 4;
}

message EvaluationProfile {
  string profile_type = 1;
  string result_kind = 2;
  string extraction_mode = 3;
  string scoring_mode = 4;
  double threshold = 5;
  string output_schema_json = 6;
  repeated string ignored_paths = 7;
}

message RemoteProviderTarget {
  string remote_server_id = 1;
  string provider_kind = 2;
  string base_url = 3;
  string api_key = 4;
  string model_id = 5;
  uint32 timeout_seconds = 6;
  uint32 rate_limit_per_minute = 7;
}

message RunEvaluationRequest {
  string model_handle = 1;
  string suite_id = 2;
  string dataset_id = 3;
  string dataset_root = 4;
  uint32 sample_size = 5;
  map<string, string> parameters = 6;
  string task_kind = 7;
  string source_repo = 8;
  uint32 few_shot = 9;
  uint64 seed = 10;
  string scoring_mode = 11;
  string code_exec_policy = 12;
  EvaluationSource source = 13;
  EvaluationFieldMapping field_mapping = 14;
  EvaluationProfile profile = 15;
  RemoteProviderTarget remote_target = 16;
}

message EvaluationMetricValue {
  string name = 1;
  double value = 2;
  string unit = 3;
}

message WorkerEvaluationJob {
  string schema_version = 1;
  string job_id = 2;
  string model_id = 3;
  string suite_id = 4;
  string dataset_id = 5;
  uint32 sample_size = 6;
  string scoring_mode = 7;
  map<string, string> parameters = 8;
  string status = 9;
  string task_kind = 10;
  string source_repo = 11;
  string output_dir = 12;
  int64 created_at_unix_ms = 13;
  int64 updated_at_unix_ms = 14;
}

message WorkerEvaluationResult {
  string schema_version = 1;
  string job_id = 2;
  string suite_id = 3;
  string dataset_id = 4;
  uint32 sample_size = 5;
  repeated EvaluationMetricValue metrics = 6;
  string report_path = 7;
  string evidence_path = 8;
}

message RunEvaluationResponse {
  bool ok = 1;
  ErrorStatus error = 2;
  WorkerEvaluationJob job = 3;
  repeated WorkerEvaluationResult results = 4;
}

message ExportResultsRequest {
  string output_dir = 1;
}

message ExportResultsResponse {
  bool ok = 1;
  ErrorStatus error = 2;
  string export_json = 3;
  string export_path = 4;
}

message SubmitResultsRequest {
  string output_dir = 1;
  map<string, string> device_metadata = 2;
}

message SubmitResultsResponse {
  bool ok = 1;
  ErrorStatus error = 2;
  string submission_json = 3;
}

message SearchHubModelsRequest {
  string query = 1;
  uint32 page_size = 2;
  string cursor = 3;
  bool mlx_only = 4;
}

message HubModelSummary {
  string repo_id = 1;
  string author = 2;
  string model_name = 3;
  string summary = 4;
  string pipeline_tag = 5;
  repeated string tags = 6;
  uint64 downloads = 7;
  uint64 likes = 8;
  bool mlx_compatible = 9;
  string library_name = 10;
  repeated string sibling_files = 11;
  string last_modified = 12;
  string local_fit_status = 13;
  repeated string local_fit_reasons = 14;
  uint64 estimated_artifact_bytes = 15;
  uint64 estimated_resident_bytes = 16;
  uint64 parameter_count = 17;
  string quantization_summary = 18;
  bool gated = 19;
  string recommended_action = 20;
}

message SearchHubModelsResponse {
  bool ok = 1;
  ErrorStatus error = 2;
  repeated HubModelSummary models = 3;
  string next_cursor = 4;
}

message GetHubModelCardRequest {
  string repo_id = 1;
}

message HubModelCard {
  string repo_id = 1;
  string author = 2;
  string model_name = 3;
  string summary = 4;
  string license = 5;
  string pipeline_tag = 6;
  repeated string tags = 7;
  uint64 downloads = 8;
  uint64 likes = 9;
  bool mlx_compatible = 10;
  string library_name = 11;
  repeated string sibling_files = 12;
  repeated string base_models = 13;
  string last_modified = 14;
  string local_fit_status = 15;
  repeated string local_fit_reasons = 16;
  uint64 estimated_artifact_bytes = 17;
  uint64 estimated_resident_bytes = 18;
  uint64 parameter_count = 19;
  string quantization_summary = 20;
  bool gated = 21;
  string recommended_action = 22;
}

message GetHubModelCardResponse {
  bool ok = 1;
  ErrorStatus error = 2;
  HubModelCard card = 3;
}
