syntax = "proto3";

package melix.controlplane.v1;

message ErrorStatus {
  string code = 1;
  string message = 2;
  bool retriable = 3;
  map<string, string> details = 4;
}

message HandshakeRequest {
  string protocol_version = 1;
  string app_version = 2;
  string bundle_id = 3;
  string client_instance_id = 4;
  string ui_capabilities = 5;
}

message HandshakeResponse {
  string protocol_version = 1;
  string server_version = 2;
  string daemon_instance_id = 3;
  repeated string features = 4;
  ServerSnapshot snapshot = 5;
}

message ControlPlaneRequest {
  string request_id = 1;
  string actor_id = 2;
  string command_type = 3;
  string idempotency_key = 4;
  int64 deadline_unix_ms = 5;
  string correlation_id = 6;
  string causation_id = 7;
  string target_id = 8;

  oneof command {
    ServerCommand server = 20;
    ModelCommand model = 21;
    CacheCommand cache = 22;
    SessionCommand session = 23;
    OpsCommand ops = 24;
    PresetCommand preset = 25;
    ImageCommand image = 26;
  }
}

message ControlPlaneResponse {
  string request_id = 1;
  string command_type = 2;
  bool ok = 3;
  ErrorStatus error = 4;
  string correlation_id = 5;
  string causation_id = 6;

  oneof payload {
    ServerReply server = 20;
    ModelReply model = 21;
    CacheReply cache = 22;
    SessionReply session = 23;
    OpsReply ops = 24;
    PresetReply preset = 25;
    ImageReply image = 26;
  }
}

message ControlPlaneEvent {
  string event_type = 1;
  string source = 2;
  string correlation_id = 3;
  string causation_id = 4;
  string request_id = 5;
  string actor_id = 6;
  string subscription_id = 7;
  uint64 seq = 8;
  int64 emitted_at_unix_ms = 9;

  oneof payload {
    ServerStateChanged server_state = 20;
    WorkerStateChanged worker_state = 21;
    ModelStateChanged model_state = 22;
    RequestProgressEvent request_progress = 23;
    SessionStateChanged session_state = 24;
    CacheStatsEvent cache_stats = 25;
    BenchmarkProgressEvent bench_progress = 26;
    LogEvent log = 27;
    Heartbeat heartbeat = 28;
    ResourcePressureEvent resource_pressure = 29;
    ImageJobStateChanged image_job = 30;
  }
}

message ServerCommand {
  oneof kind {
    StartServer start = 1;
    StopServer stop = 2;
    RestartServer restart = 3;
    GetServerSnapshot get_snapshot = 4;
    SetGlobalPolicy set_policy = 5;
  }
}

message ModelCommand {
  oneof kind {
    ListModels list = 1;
    LoadModel load = 2;
    UnloadModel unload = 3;
    PinModel pin = 4;
    UnpinModel unpin = 5;
    WarmupModel warmup = 6;
    SetModelPolicy set_policy = 7;
    GetModelInfo get_info = 8;
    RunModelOperation run_operation = 9;
  }
}

message CacheCommand {
  oneof kind {
    GetCacheSnapshot get_snapshot = 1;
    PurgeCache purge = 2;
    PinPrefix pin_prefix = 3;
    UnpinPrefix unpin_prefix = 4;
    SaveCheckpoint save_checkpoint = 5;
    RestoreCheckpoint restore_checkpoint = 6;
  }
}

message SessionCommand {
  oneof kind {
    CreateSession create_session = 1;
    CreateBranch create_branch = 2;
    CloseSession close_session = 3;
    GetSessionState get_state = 4;
    RegisterToolResult register_tool_result = 5;
    ResumeAfterTool resume_after_tool = 6;
  }
}

message OpsCommand {
  oneof kind {
    TailLogs tail_logs = 1;
    RunDoctor run_doctor = 2;
    RunBench run_bench = 3;
    RunEvaluation run_evaluation = 4;
    ExportDiagnostics export_bundle = 5;
    GetMetricsSnapshot get_metrics = 6;
    CancelRequest cancel_request = 7;
    ExportResults export_results = 8;
    SubmitResults submit_results = 9;
    SearchHubModels search_hub_models = 10;
    GetHubModelCard get_hub_model_card = 11;
  }
}

message PresetCommand {
  oneof kind {
    ListPresets list = 1;
    ApplyPreset apply = 2;
    ExportPreset export = 3;
    ImportPreset import = 4;
  }
}

message ImageCommand {
  oneof kind {
    GenerateImage generate = 1;
    EditImage edit = 2;
  }
}

message ServerReply {
  ServerSnapshot snapshot = 1;
}

message ModelReply {
  repeated ModelSummary models = 1;
  ModelSummary model = 2;
  ModelInfo info = 3;
  ModelOperationResult operation = 4;
}

message CacheReply {
  CacheSummary summary = 1;
  CacheSnapshot snapshot = 2;
}

message SessionReply {
  SessionState session = 1;
}

message OpsReply {
  string report_path = 1;
  string report_markdown = 2;
  MetricsSummary metrics = 3;
  BenchmarkJobSummary benchmark_job = 4;
  repeated BenchmarkResultSummary benchmark_results = 5;
  EvaluationJobSummary evaluation_job = 6;
  repeated EvaluationResultSummary evaluation_results = 7;
  string export_bundle_json = 8;
  string submission_json = 9;
  HubSearchResult hub_search = 10;
  HubModelCard hub_model_card = 11;
}

message PresetReply {
  repeated PresetSummary presets = 1;
}

message ImageReply {
  ImageJobSummary job = 1;
}

message StartServer {}
message StopServer {}
message RestartServer {}
message GetServerSnapshot {}
message SetGlobalPolicy {
  map<string, string> values = 1;
}

message ListModels {}
message LoadModel {
  string model_id = 1;
}
message UnloadModel {
  string model_id = 1;
}
message PinModel {
  string model_id = 1;
}
message UnpinModel {
  string model_id = 1;
}
message WarmupModel {
  string model_id = 1;
}
message SetModelPolicy {
  string model_id = 1;
  map<string, string> values = 2;
}
message GetModelInfo {
  string model_id = 1;
}
message RunModelOperation {
  string model_id = 1;
  string operation = 2;
  string output_dir = 3;
  string weight_quant = 4;
  string kv_quant = 5;
  bool generate_manifest = 6;
  bool run_smoke_test = 7;
  map<string, string> ext = 8;
  QuantizationProfile quant_profile = 9;
}

message GenerateImage {
  string model_id = 1;
  string prompt = 2;
  string size = 3;
  uint32 n = 4;
  string response_format = 5;
  string artifact_namespace = 6;
}

message EditImage {
  string model_id = 1;
  string prompt = 2;
  bytes image = 3;
  string image_uri = 4;
  bytes mask = 5;
  string mask_uri = 6;
  float strength = 7;
  string size = 8;
  uint32 n = 9;
  string response_format = 10;
}

message GetCacheSnapshot {}
message PurgeCache {
  string scope_id = 1;
  string tier = 2;
}
message PinPrefix {
  string prefix_id = 1;
}
message UnpinPrefix {
  string prefix_id = 1;
}
message SaveCheckpoint {
  string session_id = 1;
  string branch_id = 2;
}
message RestoreCheckpoint {
  string checkpoint_id = 1;
}

message CreateSession {}
message CreateBranch {
  string session_id = 1;
  string parent_branch_id = 2;
}
message CloseSession {
  string session_id = 1;
}
message GetSessionState {
  string session_id = 1;
}
message RegisterToolResult {
  string session_id = 1;
  string branch_id = 2;
  string tool_call_id = 3;
}
message ResumeAfterTool {
  string session_id = 1;
  string branch_id = 2;
  string snapshot_id = 3;
}

message TailLogs {}
message RunDoctor {}
message RunBench {
  repeated string suites = 1;
  map<string, string> parameters = 2;
}
message RunEvaluation {
  string suite_id = 1;
  string dataset_id = 2;
  uint32 sample_size = 3;
  map<string, string> parameters = 4;
}
message SearchHubModels {
  string query = 1;
  uint32 page_size = 2;
  string cursor = 3;
  bool mlx_only = 4;
}
message GetHubModelCard {
  string repo_id = 1;
}
message ExportDiagnostics {}
message ExportResults {
  string output_dir = 1;
}
message SubmitResults {
  string output_dir = 1;
  map<string, string> device_metadata = 2;
}
message GetMetricsSnapshot {}
message CancelRequest {
  string request_id = 1;
}

message BenchmarkMetricValue {
  string name = 1;
  double value = 2;
  string unit = 3;
}

message BenchmarkJobSummary {
  string schema_version = 1;
  string job_id = 2;
  string model_id = 3;
  repeated string suites = 4;
  map<string, string> parameters = 5;
  string status = 6;
  string output_dir = 7;
  int64 created_at_unix_ms = 8;
  int64 updated_at_unix_ms = 9;
}

message BenchmarkResultSummary {
  string schema_version = 1;
  string job_id = 2;
  string suite = 3;
  repeated BenchmarkMetricValue metrics = 4;
  string report_path = 5;
  string report_markdown = 6;
}

message EvaluationJobSummary {
  string schema_version = 1;
  string job_id = 2;
  string model_id = 3;
  string suite_id = 4;
  string dataset_id = 5;
  uint32 sample_size = 6;
  string scoring_mode = 7;
  map<string, string> parameters = 8;
  string status = 9;
}

message EvaluationResultSummary {
  string schema_version = 1;
  string job_id = 2;
  string suite_id = 3;
  string dataset_id = 4;
  uint32 sample_size = 5;
  repeated BenchmarkMetricValue metrics = 6;
  string report_path = 7;
}

message HubModelSummary {
  string repo_id = 1;
  string author = 2;
  string model_name = 3;
  string summary = 4;
  string pipeline_tag = 5;
  repeated string tags = 6;
  uint64 downloads = 7;
  uint64 likes = 8;
  bool mlx_compatible = 9;
  string library_name = 10;
  repeated string sibling_files = 11;
  string last_modified = 12;
}

message HubSearchResult {
  repeated HubModelSummary models = 1;
  string next_cursor = 2;
}

message HubModelCard {
  string repo_id = 1;
  string author = 2;
  string model_name = 3;
  string summary = 4;
  string license = 5;
  string pipeline_tag = 6;
  repeated string tags = 7;
  uint64 downloads = 8;
  uint64 likes = 9;
  bool mlx_compatible = 10;
  string library_name = 11;
  repeated string sibling_files = 12;
  repeated string base_models = 13;
  string last_modified = 14;
}

message ListPresets {}
message ApplyPreset {
  string preset_id = 1;
}
message ExportPreset {
  string preset_id = 1;
}
message ImportPreset {
  bytes payload = 1;
}

enum ServerState {
  SERVER_STATE_UNSPECIFIED = 0;
  SERVER_BOOTING = 1;
  SERVER_READY = 2;
  SERVER_DEGRADED = 3;
  SERVER_DRAINING = 4;
  SERVER_STOPPED = 5;
  SERVER_FAILED = 6;
}

enum WorkerState {
  WORKER_STATE_UNSPECIFIED = 0;
  WORKER_STARTING = 1;
  WORKER_IDLE = 2;
  WORKER_BUSY = 3;
  WORKER_SATURATED = 4;
  WORKER_DRAINING = 5;
  WORKER_EXITED = 6;
  WORKER_CRASH_LOOP = 7;
}

enum ModelState {
  MODEL_STATE_UNSPECIFIED = 0;
  MODEL_DISCOVERED = 1;
  MODEL_LOADING = 2;
  MODEL_WARM = 3;
  MODEL_PINNED = 4;
  MODEL_EVICTING = 5;
  MODEL_UNLOADED = 6;
  MODEL_FAILED = 7;
}

enum ModelCapabilityClass {
  MODEL_CAPABILITY_CLASS_UNSPECIFIED = 0;
  MODEL_CAPABILITY_TEXT = 1;
  MODEL_CAPABILITY_EMBEDDING = 2;
  MODEL_CAPABILITY_RERANK = 3;
  MODEL_CAPABILITY_MODEL_OPERATIONS = 4;
  MODEL_CAPABILITY_MULTIMODAL = 5;
  MODEL_CAPABILITY_OCR = 6;
  MODEL_CAPABILITY_VLM = 7;
  MODEL_CAPABILITY_TRANSCRIPTION = 8;
  MODEL_CAPABILITY_SPEECH = 9;
  MODEL_CAPABILITY_IMAGE_GENERATION = 10;
}

enum WorkerRouteClass {
  WORKER_ROUTE_CLASS_UNSPECIFIED = 0;
  WORKER_ROUTE_SWIFT_TEXT = 1;
  WORKER_ROUTE_PYTHON_TEXT_COMPATIBILITY = 2;
  WORKER_ROUTE_PYTHON_EMBEDDING = 3;
  WORKER_ROUTE_PYTHON_RERANK = 4;
  WORKER_ROUTE_PYTHON_MODEL_OPERATIONS = 5;
  WORKER_ROUTE_PYTHON_OCR = 6;
  WORKER_ROUTE_PYTHON_VLM = 7;
  WORKER_ROUTE_PYTHON_TRANSCRIPTION = 8;
  WORKER_ROUTE_PYTHON_SPEECH = 9;
  WORKER_ROUTE_PYTHON_IMAGE = 10;
}

enum MemoryResidencyPolicy {
  MEMORY_RESIDENCY_POLICY_UNSPECIFIED = 0;
  MEMORY_RESIDENCY_EVICTABLE = 1;
  MEMORY_RESIDENCY_PINNED = 2;
  MEMORY_RESIDENCY_TTL = 3;
}

enum ResidencyState {
  RESIDENCY_STATE_UNSPECIFIED = 0;
  RESIDENCY_STATE_DISCOVERED = 1;
  RESIDENCY_STATE_LOADING = 2;
  RESIDENCY_STATE_WARM = 3;
  RESIDENCY_STATE_PINNED = 4;
  RESIDENCY_STATE_EVICTING = 5;
  RESIDENCY_STATE_UNLOADED = 6;
  RESIDENCY_STATE_FAILED = 7;
}

enum RequestPhase {
  REQUEST_PHASE_UNSPECIFIED = 0;
  REQUEST_QUEUED = 1;
  REQUEST_PREFILLING = 2;
  REQUEST_DECODING = 3;
  REQUEST_TOOL_WAIT = 4;
  REQUEST_CHECKPOINTING = 5;
  REQUEST_COMPLETED = 6;
  REQUEST_ABORTED = 7;
  REQUEST_FAILED = 8;
  REQUEST_ADMITTED = 9;
  REQUEST_REJECTED = 10;
}

enum AdmissionState {
  ADMISSION_STATE_UNSPECIFIED = 0;
  ADMISSION_QUEUED = 1;
  ADMISSION_ADMITTED = 2;
  ADMISSION_REJECTED = 3;
  ADMISSION_DROPPED = 4;
}

enum AccelerationMode {
  ACCELERATION_MODE_UNSPECIFIED = 0;
  ACCELERATION_MODE_BASELINE = 1;
  ACCELERATION_MODE_SPECULATIVE_DECODE = 2;
  ACCELERATION_MODE_ACCELERATED_PREFILL = 3;
  ACCELERATION_MODE_ACTIVE_KV_QUANTIZED = 4;
  ACCELERATION_MODE_SPARSE_PREFILL = 5;
}

message ModelSettings {
  string alias = 1;
  string type_override = 2;
  uint32 ttl_seconds = 3;
  bool pin_on_load = 4;
  MemoryResidencyPolicy memory_policy = 5;
  AccelerationMode default_acceleration_mode = 6;
  string acceleration_profile_id = 7;
  map<string, string> ext = 8;
  AdaptiveThinkingPolicy adaptive_thinking = 9;
}

message AdaptiveThinkingPolicy {
  string mode = 1;
  uint32 budget_tokens = 2;
}

message ResidencySummary {
  ResidencyState state = 1;
  MemoryResidencyPolicy policy = 2;
  bool pin_requested = 3;
  bool pinned = 4;
  uint32 ttl_seconds = 5;
  string transition_reason = 6;
}

enum EventTopic {
  EVENT_TOPIC_UNSPECIFIED = 0;
  EVENT_TOPIC_SERVER = 1;
  EVENT_TOPIC_WORKER = 2;
  EVENT_TOPIC_MODEL = 3;
  EVENT_TOPIC_REQUEST = 4;
  EVENT_TOPIC_SESSION = 5;
  EVENT_TOPIC_CACHE = 6;
  EVENT_TOPIC_RESOURCE = 7;
  EVENT_TOPIC_BENCHMARK = 8;
  EVENT_TOPIC_LOG = 9;
  EVENT_TOPIC_IMAGE = 10;
}

enum ImageJobState {
  IMAGE_JOB_STATE_UNSPECIFIED = 0;
  IMAGE_JOB_QUEUED = 1;
  IMAGE_JOB_RUNNING = 2;
  IMAGE_JOB_CANCELED = 3;
  IMAGE_JOB_FAILED = 4;
  IMAGE_JOB_COMPLETED = 5;
}

enum ImageArtifactRole {
  IMAGE_ARTIFACT_ROLE_UNSPECIFIED = 0;
  IMAGE_ARTIFACT_INPUT = 1;
  IMAGE_ARTIFACT_MASK = 2;
  IMAGE_ARTIFACT_GENERATED = 3;
  IMAGE_ARTIFACT_EDIT_SOURCE = 4;
  IMAGE_ARTIFACT_PREVIEW = 5;
}

message ImageJobProgress {
  string stage = 1;
  float pct = 2;
  uint32 completed_steps = 3;
  uint32 total_steps = 4;
}

message ImageArtifactRef {
  string artifact_id = 1;
  string job_id = 2;
  ImageArtifactRole role = 3;
  string mime_type = 4;
  string format = 5;
  uint32 width = 6;
  uint32 height = 7;
  uint64 byte_length = 8;
  string storage_uri = 9;
  string sha256 = 10;
  uint32 variant_index = 11;
  map<string, string> ext = 12;
}

message ImageJobSummary {
  string job_id = 1;
  string request_id = 2;
  string model_id = 3;
  string operation = 4;
  ImageJobState state = 5;
  string lane = 6;
  string worker_id = 7;
  ImageJobProgress progress = 8;
  repeated ImageArtifactRef artifacts = 9;
  ErrorStatus error = 10;
  bool cancelable = 11;
  int64 created_at_unix_ms = 12;
  int64 updated_at_unix_ms = 13;
  string prompt_digest = 14;
}

message SubscribeRequest {
  string client_instance_id = 1;
  string last_subscription_id = 2;
  uint64 last_seen_seq = 3;
  repeated EventTopic topics = 4;
}

message MCPToolSourceSummary {
  string source_id = 1;
  bool enabled = 2;
  repeated string namespaces = 3;
  uint32 tool_count = 4;
}

message MCPToolCatalogSummary {
  string config_path = 1;
  string default_parser_mode = 2;
  uint32 enabled_source_count = 3;
  uint32 resolved_tool_count = 4;
  repeated MCPToolSourceSummary sources = 5;
}

enum GatewayAccessMode {
  GATEWAY_ACCESS_MODE_UNSPECIFIED = 0;
  GATEWAY_ACCESS_MODE_NONE = 1;
  GATEWAY_ACCESS_MODE_BEARER_TOKEN = 2;
  GATEWAY_ACCESS_MODE_API_KEYS = 3;
}

enum GatewayAuthHeader {
  GATEWAY_AUTH_HEADER_UNSPECIFIED = 0;
  GATEWAY_AUTH_HEADER_NONE = 1;
  GATEWAY_AUTH_HEADER_AUTHORIZATION_BEARER = 2;
  GATEWAY_AUTH_HEADER_X_API_KEY = 3;
}

message GatewayAccessKeySummary {
  string key_id = 1;
  string label = 2;
  string token_hint = 3;
}

message GatewayAccessSummary {
  GatewayAccessMode mode = 1;
  bool shared_access_enabled = 2;
  bool shared_access_ready = 3;
  GatewayAuthHeader required_header = 4;
  uint32 accepted_api_key_count = 5;
  repeated GatewayAccessKeySummary keys = 6;
}

message ServerSnapshot {
  ServerState server_state = 1;
  repeated WorkerSummary workers = 2;
  repeated ModelSummary models = 3;
  QueueSummary queues = 4;
  CacheSummary cache = 5;
  ResourceSnapshot resources = 6;
  MetricsSummary metrics = 7;
  repeated SessionSummary sessions = 8;
  repeated RecentError recent_errors = 9;
  repeated ImageJobSummary image_jobs = 10;
  MCPToolCatalogSummary mcp_tools = 11;
  GatewayAccessSummary gateway_access = 12;
}

message WorkerSummary {
  string worker_id = 1;
  string worker_kind = 2;
  WorkerState state = 3;
  repeated string loaded_model_handles = 4;
  uint64 inflight_requests = 5;
  uint64 active_prefills = 6;
  uint64 active_decodes = 7;
  ResourceSnapshot resources = 8;
  repeated RecentError recent_errors = 9;
}

message ModelSummary {
  string model_id = 1;
  string kind = 2;
  ModelState state = 3;
  bool pinned = 4;
  uint64 inflight_requests = 5;
  uint64 estimated_bytes = 6;
  string quant_profile_id = 7;
  uint32 max_context = 8;
  repeated string features = 9;
  ModelCapabilityClass capability_class = 10;
  WorkerRouteClass route_class = 11;
  ModelSettings settings = 12;
  repeated string supported_modalities = 13;
  repeated string supported_tasks = 14;
  ResidencySummary residency = 15;
}

message ModelInfo {
  bool ok = 1;
  string model_kind = 2;
  uint32 max_context = 3;
  repeated string supported_parsers = 4;
  repeated string supported_modalities = 5;
  repeated string supported_tasks = 6;
}

message ModelOperationResult {
  bool ok = 1;
  string operation = 2;
  string job_id = 3;
  string stage = 4;
  float pct = 5;
  string output_path = 6;
  string manifest_json = 7;
  ErrorStatus error = 8;
  QuantizationProfile quant_profile = 9;
  ModelOperationArtifact artifact = 10;
}

message QuantizationProfile {
  string algorithm = 1;
  string schema_version = 2;
  string quant_profile_id = 3;
  string weight_quant = 4;
  string kv_quant = 5;
  map<string, string> ext = 6;
}

message ModelOperationArtifact {
  string schema_version = 1;
  string artifact_kind = 2;
  string manifest_path = 3;
  string bundle_path = 4;
  uint64 artifact_bytes = 5;
  uint64 manifest_bytes = 6;
  bool serving_compatible = 7;
  bool smoke_test_requested = 8;
  bool smoke_test_passed = 9;
  string runtime = 10;
}

message QueueSummary {
  repeated QueueLaneSummary lanes = 1;
  uint32 queued_requests = 2;
  uint32 active_requests = 3;
  double admission_latency_ms = 4;
  double backpressure = 5;
  uint32 admitted_requests = 6;
  uint32 rejected_requests = 7;
}

message QueueLaneSummary {
  string lane_id = 1;
  uint32 queued_requests = 2;
  uint32 active_requests = 3;
  double queue_delay_ms_p50 = 4;
  double queue_delay_ms_p95 = 5;
  double admission_rate = 6;
  double backpressure = 7;
  string lane_class = 8;
  double priority_score = 9;
}

message CacheSummary {
  uint64 l1_bytes = 1;
  uint64 l2_bytes = 2;
  double l1_hit_rate = 3;
  double l2_hit_rate = 4;
  double dedup_ratio = 5;
  double pinned_prefix_hit_rate = 6;
  uint64 checkpoint_count = 7;
  repeated CacheKey hot_keys = 8;
  uint64 block_count = 9;
  uint64 quantized_bytes = 10;
  double compression_ratio = 11;
  double l2_restore_hit_rate = 12;
  repeated PrefixRef hot_prefixes = 13;
  repeated SnapshotRef recent_snapshots = 14;
  CacheMode active_mode = 15;
}

enum CacheMode {
  CACHE_MODE_UNSPECIFIED = 0;
  CACHE_MODE_TIERED = 1;
  CACHE_MODE_ROTATING = 2;
  CACHE_MODE_HYBRID = 3;
}

message CacheScopeKey {
  string model_id = 1;
  string revision = 2;
  string tokenizer_hash = 3;
  string quant_profile_id = 4;
  string prompt_template_hash = 5;
  string parser_mode = 6;
  string reasoning_mode = 7;
  string multimodal_adapter_hash = 8;
  string scope_id = 9;
}

message CacheKey {
  bytes prefix_hash = 1;
  CacheScopeKey scope = 2;
  bytes fingerprint_hash = 3;
}

message CacheBlockRef {
  string block_id = 1;
  uint32 token_length = 2;
  uint64 bytes = 3;
}

message PageRef {
  string page_id = 1;
  repeated string block_ids = 2;
  uint32 token_start = 3;
  uint32 token_end = 4;
  uint64 bytes = 5;
}

message BlockTable {
  string block_table_id = 1;
  repeated CacheBlockRef blocks = 2;
  repeated PageRef pages = 3;
  bytes prefix_hash = 4;
  string scope_id = 5;
  uint32 total_token_count = 6;
  bytes fingerprint_hash = 7;
}

message PrefixRef {
  string prefix_id = 1;
  CacheKey cache_key = 2;
  uint32 token_length = 3;
  string tier = 4;
  bool pinned = 5;
}

message SnapshotRef {
  string snapshot_id = 1;
  uint32 token_boundary = 2;
  string request_id = 3;
  string session_id = 4;
  string branch_id = 5;
  string checkpoint_id = 6;
}

message CacheRestoreBoundary {
  SnapshotRef snapshot = 1;
  bytes prefix_hash = 2;
  string scope_id = 3;
  string boundary_kind = 4;
  bytes fingerprint_hash = 5;
}

message CacheRestorePlan {
  string plan_id = 1;
  CacheRestoreBoundary boundary = 2;
  BlockTable block_table = 3;
  uint32 restored_token_count = 4;
  bool partial = 5;
  string tier = 6;
  CacheMode cache_mode = 7;
}

message CacheScopeSummary {
  string scope_id = 1;
  CacheScopeKey scope = 2;
  uint64 l1_bytes = 3;
  uint64 l2_bytes = 4;
  uint64 block_count = 5;
  uint64 prefix_count = 6;
  uint64 snapshot_count = 7;
  repeated CacheBlockRef hot_blocks = 8;
  repeated SnapshotRef recent_snapshots = 9;
}

message CacheSnapshot {
  CacheSummary summary = 1;
  repeated CacheScopeSummary scopes = 2;
  repeated PrefixRef pinned_prefixes = 3;
  repeated PrefixRef hot_prefixes = 4;
